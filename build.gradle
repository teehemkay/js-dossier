plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url 'https://maven.google.com' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

sourceSets {
    main {
        java { srcDirs = ['src/java'] }
        resources {
            srcDirs = ['src/java']
            include '**/*.soy'
            include '**/*.css'
            include '**/resources/**'
        }
    }
}

dependencies {
    implementation 'com.google.javascript:closure-compiler-unshaded:v20190819'
    implementation 'com.google.javascript:closure-compiler-externs:v20190819'
    implementation 'com.google.template:soy:2019-08-22'
    implementation 'com.google.guava:guava:27.0.1-jre'
    implementation 'com.google.inject:guice:4.1.0'
    implementation 'com.google.inject.extensions:guice-multibindings:4.1.0'
    implementation 'com.atlassian.commonmark:commonmark:0.12.1'
    implementation 'args4j:args4j:2.0.26'
    implementation 'com.google.code.findbugs:jsr305:1.3.9'
    implementation 'com.google.jimfs:jimfs:1.0'
    implementation 'org.jsoup:jsoup:1.8.3'
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:r239'
    implementation 'com.google.protobuf:protobuf-java:3.9.0'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.google.common.html.types:types:1.0.8'
    implementation 'javax.inject:javax.inject:1'
}
